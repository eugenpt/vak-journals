name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download PDF and build initial data
        run: python build.py --download

      - name: Fetch Scopus data
        env:
          SCOPUS_API_KEY: ${{ secrets.SCOPUS_API_KEY }}
        run: python fetch_scopus.py

      - name: Fetch RCSI data
        run: python fetch_rcsi.py

      - name: Rebuild with index data
        run: python build.py

      - name: Match VAK categories
        run: |
          curl -sL -o data/vak_k_categories.pdf \
            "https://vak.gisnauka.ru/s3-files/01cc80c69fae4988a0246a8f5e2774e7:fisgna/public/media/uploaded/news_files/95b18614-ac93-490c-9650-0b545506660c/7c0ef8d2-d0b2-4ffc-ba4b-ecece35288f0.pdf"
          python data/match_k_cats.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
